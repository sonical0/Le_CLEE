<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agenda des événements CLEE Bordeaux Avenir - Découvrez tous les événements de l'année">
    <title>CLEE Bordeaux Avenir - Agenda</title>
    <link rel="stylesheet" href="../css/globals.css">
    <link rel="stylesheet" href="../css/agenda.css">
</head>
<body>
    <clee-nav-bar base-path=".." pages-path=""></clee-nav-bar>

    <div class="breadcrumb-container">
        <div class="container">
            <nav class="breadcrumb" aria-label="Fil d'ariane">
                <a href="../index.html">Accueil</a>
                <span>/</span>
                <a href="vie-clee.html">Vie du CLEE</a>
                <span>/</span>
                <span>Agenda</span>
            </nav>
        </div>
    </div>

    <section class="hero">
        <div class="hero-overlay" aria-hidden="true">
            <!-- TODO: Remplacer l'image du calque du hero par la photo définitive -->
            <img src="https://picsum.photos/1920/1080" alt="" loading="lazy">
        </div>
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Agenda 2026</h1>
                <p class="hero-description">
                    Découvrez tous les événements, rencontres et activités organisés par le CLEE Bordeaux Avenir tout au long de l'année.
                </p>
            </div>
        </div>
    </section>

    <section class="filters-section">
        <div class="container">
            <div class="filters-container">
                <div class="filter-group">
                    <label for="month-filter" class="filter-label">Mois</label>
                    <select id="month-filter" class="filter-select">
                        <option value="all">Tous les mois</option>
                        <option value="0">Janvier</option>
                        <option value="1">Février</option>
                        <option value="2">Mars</option>
                        <option value="3">Avril</option>
                        <option value="4">Mai</option>
                        <option value="5">Juin</option>
                        <option value="6">Juillet</option>
                        <option value="7">Août</option>
                        <option value="8">Septembre</option>
                        <option value="9">Octobre</option>
                        <option value="10">Novembre</option>
                        <option value="11">Décembre</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="type-filter" class="filter-label">Type d'événement</label>
                    <select id="type-filter" class="filter-select">
                        <option value="all">Tous les types</option>
                        <option value="conference">Conférence</option>
                        <option value="atelier">Atelier</option>
                        <option value="forum">Forum</option>
                        <option value="rencontre">Rencontre</option>
                        <option value="salon">Salon</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="search-filter" class="filter-label">Rechercher</label>
                    <input type="text" id="search-filter" class="filter-input" placeholder="Rechercher un événement...">
                </div>

                <button id="reset-filters" class="btn btn-secondary">
                    Réinitialiser les filtres
                </button>
            </div>
        </div>
    </section>

    <section class="events-section">
        <div class="container">
            <div class="view-toggle">
                <button class="view-btn active" data-view="calendar">
                    <span class="icon">📅</span>
                    Vue calendrier
                </button>
                <button class="view-btn" data-view="list">
                    <span class="icon">📋</span>
                    Vue liste
                </button>
            </div>

            <div id="calendar-view" class="calendar-view">
                <div class="calendar-header">
                    <button id="prev-month" class="calendar-nav-btn">‹</button>
                    <h2 id="current-month" class="calendar-month"></h2>
                    <button id="next-month" class="calendar-nav-btn">›</button>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>

            <div id="list-view" class="list-view" style="display: none;">
                <div id="events-list" class="events-list"></div>
            </div>

            <div id="no-results" class="no-results" style="display: none;">
                <div class="no-results-icon">🔍</div>
                <h3>Aucun événement trouvé</h3>
                <p>Essayez de modifier vos filtres de recherche</p>
            </div>
        </div>
    </section>

    <div id="event-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <clee-footer base-path=".." pages-path=""></clee-footer>

    <script src="../js/components/nav-bar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/agenda.js"></script>
</body>
</html>
