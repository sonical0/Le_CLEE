<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lycée Professionnel Talence - Découvrez nos formations et nos équipements - CLEE Bordeaux Avenir">
    <title>Lycée Professionnel Talence - CLEE Bordeaux Avenir</title>
    <link rel="stylesheet" href="../css/globals.css">
    <link rel="stylesheet" href="../css/establishments.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        :root {
            --color-industrie: #176ea1;
            --color-tertiaire: #c63634;
            --color-numerique: #589842;
            --color-batiment: #d8861b;
        }
    </style>
</head>
<body>
    <clee-nav-bar base-path=".." pages-path=""></clee-nav-bar>

    <div class="breadcrumb-container">
        <div class="container">
            <nav class="breadcrumb" aria-label="Fil d'ariane">
                <a href="../index.html">Accueil</a>
                <span>/</span>
                <span>Établissements</span>
            </nav>
        </div>
    </div>

    <section class="formations-search-section" id="filtres">
        <div class="container">
            <h2 class="section-title">Rechercher une formation</h2>
            <form class="formations-search-bar" autocomplete="off">
                <input type="text" id="formation-search-input" placeholder="Rechercher par nom de formation, mot-clé..." aria-label="Recherche formation">
                <select id="formation-secteur-filter" aria-label="Filtrer par secteur">
                    <option value="tous">Tous les secteurs</option>
                    <option value="industrie">Industrie</option>
                    <option value="numerique">Numérique</option>
                    <option value="tertiaire">Tertiaire</option>
                    <option value="batiment">Bâtiment</option>
                </select>
                <select id="formation-niveau-filter" aria-label="Filtrer par niveau">
                    <option value="tous">Tous les niveaux</option>
                    <option value="CAP">CAP</option>
                    <option value="BAC PRO">BAC PRO</option>
                    <option value="BTS">BTS</option>
                </select>
                <select id="formation-formations-filter" aria-label="Filtrer par formations">
                    <option value="tous">Toutes les formations</option>
                    <option value="cap-electricien">CAP Électricien</option>
                    <option value="bac-pro-sn">Bac Pro Systèmes Numériques</option>
                    <option value="bac-pro-ga">Bac Pro Gestion Administrative</option>
                    <option value="bts-cybersecurite">BTS Cybersécurité</option>
                    <option value="bts-sio">BTS SIO - Option SLAM</option>
                    <option value="cap-macon">CAP Maçon</option>
                </select>
                <clee-primary-button as="button" type="submit" text="Filtrer"></clee-primary-button>
            </form>
        </div>
    </section>

    <section class="hero-etablissement">
        <div class="hero-overlay hero-overlay-hidden" aria-hidden="true">
            <!-- TODO: Remplacer l'image du calque du hero par la photo définitive -->
            <img src="https://picsum.photos/1920/1080" alt="" loading="lazy">
        </div>
        <div class="container">
            <div class="hero-grid">
                <div class="carte-ecoles-wrapper">
                    <h2 class="carte-title">Établissements du CLEE</h2>
                    <p class="carte-subtitle">Sélectionnez un établissement sur la carte</p>
                    
                    <div class="carte-interactive">
                        <div class="carte-map" id="establishmentsMap" role="application" aria-label="Carte interactive des établissements"></div>
                    </div>

                    <div class="ecoles-list" id="ecolesList"></div>
                </div>
                
                <div class="etablissement-card" id="etablissement-content">
                    <div class="etablissement-content">
                        <p>Chargement des établissements...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="formations-section" id="formations" style="display: none;">
        <div class="container">
            <h2 class="section-title">Formations proposées</h2>
            
            <div class="formations-grid"></div>
        </div>
    </section>

    <clee-footer base-path=".." pages-path=""></clee-footer>

    <script src="../js/components/nav-bar.js"></script>
    <script src="../js/components/primary-button.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/formations.js"></script>
    <script src="../js/establishments.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</body>
</html>
