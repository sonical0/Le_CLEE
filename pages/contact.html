<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez CLEE Bordeaux Avenir - Formulaire de contact pour vos demandes de partenariat, d'information ou de stage">
    <title>CLEE Bordeaux Avenir - Contact</title>
    <link rel="stylesheet" href="../css/globals.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <clee-nav-bar base-path=".." pages-path=""></clee-nav-bar>

    <div class="breadcrumb-container">
        <div class="container">
            <nav class="breadcrumb" aria-label="Fil d'ariane">
                <a href="../index.html">Accueil</a>
                <span>/</span>
                <span>Contact</span>
            </nav>
        </div>
    </div>

    <clee-hero
        base-path=".."
        title="Contactez-nous"
        description="Vous avez une question, une proposition de partenariat ou besoin d'informations ? Remplissez ce formulaire."
        image-url="https://picsum.photos/1920/1080">
    </clee-hero>

    <section class="contact-form-section">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <h2 class="form-title">Envoyez-nous un message</h2>
                    <p class="form-description">
                        Remplissez les champs ci-dessous et nous vous répondrons rapidement.
                    </p>
                </div>

                <form id="contactForm" class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName" class="form-label">Prénom <span class="required">*</span></label>
                            <input 
                                type="text" 
                                id="firstName" 
                                name="firstName" 
                                class="form-input" 
                                placeholder="Votre prénom"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName" class="form-label">Nom <span class="required">*</span></label>
                            <input 
                                type="text" 
                                id="lastName" 
                                name="lastName" 
                                class="form-input" 
                                placeholder="Votre nom"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email <span class="required">*</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="votre.email@exemple.com"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="subject" class="form-label">Objet <span class="required">*</span></label>
                        <select id="subject" name="subject" class="form-select" required>
                            <option value="">Sélectionnez un objet</option>
                            <option value="partenariat">Proposition de partenariat</option>
                            <option value="evenement">Organisation d'événement</option>
                            <option value="stage">Recherche de stage/alternance</option>
                            <option value="information">Demande d'information</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message" class="form-label">Message <span class="required">*</span></label>
                        <textarea 
                            id="message" 
                            name="message" 
                            class="form-textarea" 
                            rows="8" 
                            placeholder="Décrivez votre demande..."
                            required
                        ></textarea>
                    </div>
                    
                    <div class="form-footer">
                        <clee-primary-button as="button" type="submit" text="Envoyer le message"></clee-primary-button>
                        <p class="form-note">* Champs obligatoires</p>
                    </div>
                </form>
                
                <div id="formSuccess" class="form-message success" style="display: none;">
                    <div class="message-icon">✅</div>
                    <h3 class="message-title">Message envoyé !</h3>
                    <p class="message-text">Nous avons bien reçu votre message.</p>
                </div>
                
                <div id="formError" class="form-message error" style="display: none;">
                    <div class="message-icon">❌</div>
                    <h3 class="message-title">Erreur</h3>
                    <p class="message-text">Une erreur est survenue lors de l'envoi du message. Veuillez réessayer.</p>
                </div>
            </div>
        </div>
    </section>

    <clee-footer base-path=".." pages-path=""></clee-footer>

    <script src="../js/components/nav-bar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/components/primary-button.js"></script>
    <script src="../js/components/hero.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/contact.js"></script>
</body>
</html>
